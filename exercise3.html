       <h1>Exercise Three</h1>
       <h3>See the console for output</h3>


<script>
let sum = 0;
let number = 1;
while (number<=50)
{
  sum += number
  number++;
}
console.log(`Sum of numbers from 1 to 50: ${sum}`)
</script>
